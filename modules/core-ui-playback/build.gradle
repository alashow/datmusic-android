import tm.alashow.buildSrc.App
import tm.alashow.buildSrc.Deps

plugins {
	id "com.android.library"
	id "dagger.hilt.android.plugin"
	id "com.google.devtools.ksp"
	id "org.jetbrains.kotlin.plugin.compose"
}

android {
	compileSdkVersion App.compileSdkVersion

	defaultConfig {
		minSdkVersion App.minSdkVersion

		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
	}


	buildFeatures {
		compose = true
	}

	namespace 'tm.alashow.datmusic.ui.playback'
}


dependencies {
	api(project(":modules:core-playback"))
	api(project(":modules:common-compose"))
	api(project(":modules:common-ui-theme"))
	api(project(":modules:common-ui-components"))
	api(project(":modules:core-ui-media"))
	implementation project(":modules:navigation")

	implementation Deps.Dagger.hilt
	ksp Deps.Dagger.compiler
	ksp Deps.Dagger.hiltCompiler

	testImplementation project(":modules:common-testing")
	kspTest Deps.Dagger.hiltCompiler
}
